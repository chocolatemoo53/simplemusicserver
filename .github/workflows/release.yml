name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            cmd/tubesync/go.sum
      - name: Build
        env:
          DEFAULT_HOST: ${{ vars.TUBESYNC_DEFAULT_HOST }}
        run: |
          set -euo pipefail
          dist="$GITHUB_WORKSPACE/dist"
          mkdir -p "$dist"
          package() {
            local name="$1" os="$2"
            if [ "$os" = windows ]; then
              (cd "$RUNNER_TEMP" && zip -qr "$dist/$name.zip" "$name")
            else
              tar -C "$RUNNER_TEMP" -czf "$dist/$name.tar.gz" "$name"
            fi
          }
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            ext=""
            if [ "$os" = windows ]; then ext=".exe"; fi

            name="simplemusicserver-${GITHUB_REF_NAME}-${os}-${arch}"
            mkdir -p "$RUNNER_TEMP/$name"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w" \
              -o "$RUNNER_TEMP/$name/simplemusicserver$ext" .
            cp -R assets config.example.toml LICENSE README.md "$RUNNER_TEMP/$name/"
            package "$name" "$os"

            name="tubesync-${GITHUB_REF_NAME}-${os}-${arch}"
            mkdir -p "$RUNNER_TEMP/$name"
            (cd cmd/tubesync && CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v} -X main.defaultHost=${DEFAULT_HOST}" \
              -o "$RUNNER_TEMP/$name/tubesync$ext" .)
            cp LICENSE "$RUNNER_TEMP/$name/"
            package "$name" "$os"
          done
          cd "$dist"
          sha256sum -- * > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
