# fly.toml app configuration file generated for simplemusicserver on 2024-11-02T01:38:49-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'simplemusicserver'
primary_region = 'lax'

[build]
  [build.args]
    GO_VERSION = '1.18'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
